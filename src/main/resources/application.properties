spring.application.name=ecomonitor
# WAL + synchronous=NORMAL: o commit nao espera um fsync em disco a cada medicao (no modo padrao
# cada gravacao levava 12 a 900 ms neste Windows, dominando as medicoes de rede)
spring.datasource.url=jdbc:sqlite:ecomonitor.db?journal_mode=WAL&synchronous=NORMAL&busy_timeout=5000
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
ecomonitor.sensor-timeout-segundos=15
ecomonitor.sessao-validade-horas=8
ecomonitor.chave-registro=chave-de-teste-ecomonitor
ecomonitor.usuarios.admin-senha=admin123
ecomonitor.usuarios.visitante-senha=visitante123
# Logs com data/hora no console e tambem em arquivo (evidencia para o relatorio)
logging.file.name=logs/ecomonitor.log
logging.pattern.dateformat=yyyy-MM-dd HH:mm:ss.SSS
